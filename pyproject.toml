[project]
name = "path-to-tree-printer"
version = "0.1.1"
description = "Takes a list of paths and renders them as an ASCII tree structure indented by directory hierarchy."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
